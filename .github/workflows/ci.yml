name: Operator CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOWORK: 'off'
jobs:
  checks:
    name: Lint, tests and packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Resolve package version and image tag
        id: identity
        run: python3 hack/ci-metadata.py >> "$GITHUB_OUTPUT"
      - name: Lint Go code
        run: make lint
      - name: Scan source and Git history for credentials
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . --log-opts=--all --redact --no-banner
          gitleaks dir . --redact --no-banner
      - name: Test source, generated files and Helm chart
        run: make check
      - name: Test CRD lifecycle and Connector election with an isolated API server
        run: |
          mkdir -p .cache/envtest
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.34.1/envtest-v1.34.1-linux-amd64.tar.gz -o .cache/envtest.tar.gz
          echo 'c8500090806ed5ce4064eeeb2a5666476a5168c1f4ff0eadd54fe59b22c4baa7  .cache/envtest.tar.gz' | sha256sum --check
          tar -xzf .cache/envtest.tar.gz -C .cache/envtest
          KUBEBUILDER_ASSETS="$PWD/.cache/envtest/controller-tools/envtest" go test -tags=integration ./cmd ./tests/packaging -count=1 -timeout=180s
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Build operator and chart
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          IMG: ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
        run: make build chart-package
      - name: Save versioned installation packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arally-operator-${{ steps.identity.outputs.tag }}
          path: |
            dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  release-e2e:
    name: Release lifecycle gate
    needs: checks
    if: github.event_name == 'push'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  image:
    name: Build and publish image
    needs: [checks, release-e2e]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name == 'pull_request' || needs.release-e2e.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR for a trusted build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image; fork PRs never log in or push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ needs.checks.outputs.image }}:${{ needs.checks.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.checks.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image result
        env:
          IMAGE: ${{ needs.checks.outputs.image }}:${{ needs.checks.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$PUBLISHED" == true ]]; then
            echo "Published: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Fork PR: image built successfully without registry publication.' >> "$GITHUB_STEP_SUMMARY"
          fi
