name: AgentRally Operator CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  security:
    uses: ./.github/workflows/security.yml
  packages:
    uses: ./.github/workflows/packages.yml
  e2e:
    needs: [checks, security, packages]
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.packages.outputs.image }}
      image_artifact: agentrally-operator-image
      chart_artifact: agentrally-operator-chart
