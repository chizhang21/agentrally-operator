name: Build Codex Mobile image
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry hostname, without https:// or a path
        required: true
        default: ghcr.io
        type: string
      image_repository:
        description: Repository path, such as your-name/codex-mobile; empty uses the fork owner
        required: false
        type: string
      image_tag:
        description: Image tag
        required: true
        default: latest
        type: string
      codexapp_version:
        description: Codex Mobile npm version, or latest
        required: true
        default: latest
        type: string
      codex_version:
        description: Codex CLI npm version, or latest
        required: true
        default: latest
        type: string
permissions:
  contents: read
concurrency:
  group: codex-mobile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate build inputs
        id: identity
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CODEXAPP_VERSION: ${{ inputs.codexapp_version }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 examples/codex-mobile/validate-build-inputs.py
      - name: Check registry credentials
        env:
          REGISTRY: ${{ steps.identity.outputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [[ -n "$REGISTRY_USERNAME" && -z "$REGISTRY_PASSWORD" ]] || [[ -z "$REGISTRY_USERNAME" && -n "$REGISTRY_PASSWORD" ]]; then
            echo 'Set both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither for the default GHCR login.' >&2
            exit 1
          fi
          if [[ "$REGISTRY" != ghcr.io && ( -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ) ]]; then
            echo 'This registry requires REGISTRY_USERNAME and REGISTRY_PASSWORD repository Secrets.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: examples/codex-mobile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          no-cache: ${{ inputs.codexapp_version == 'latest' || inputs.codex_version == 'latest' }}
          tags: ${{ steps.identity.outputs.image }}
          build-args: |
            CODEXAPP_VERSION=${{ inputs.codexapp_version }}
            CODEX_VERSION=${{ inputs.codex_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=codex-mobile
          cache-to: type=gha,mode=max,scope=codex-mobile
      - name: Check interactive terminal
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          docker run --rm -i --network none --entrypoint node "$IMAGE" < examples/codex-mobile/check-terminal.cjs
      - name: Check CLI and password-protected web server
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec 'mkdir -p "$CODEX_HOME"; codex --version'
          container=$(docker run -d --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --tmpfs /workspace:rw,nosuid,nodev,uid=1000,gid=1000,mode=0700 \
            "$IMAGE" --port 5900 --password smoke-test-only --no-open --no-tunnel --no-login)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec -i "$container" node < examples/codex-mobile/check-web.cjs; then
              echo 'Codex CLI and authenticated web UI checks passed.'
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.identity.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Push checked image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          docker push "$IMAGE"
          printf 'Published image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
