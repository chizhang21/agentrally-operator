name: AgentRally Operator E2E
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        type: string
        default: ''
      image_artifact:
        type: string
        default: ''
      chart_artifact:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Download the release image
        if: inputs.image_artifact != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.image_artifact }}
          path: .cache/release/image
      - name: Load the release image
        if: inputs.image_artifact != ''
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          test -n "$IMAGE"
          docker image load --input .cache/release/image/agentrally-operator-image.tar
          docker image inspect "$IMAGE" >/dev/null
      - name: Download the release chart
        if: inputs.chart_artifact != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.chart_artifact }}
          path: .cache/release/chart
      - name: Select the release chart
        if: inputs.chart_artifact != ''
        run: |
          charts=(.cache/release/chart/*.tgz)
          if (( ${#charts[@]} != 1 )) || [[ ! -f "${charts[0]}" ]]; then
            echo 'Expected exactly one release Chart archive.' >&2
            exit 1
          fi
          printf 'E2E_CHART=%s/%s\n' "$PWD" "${charts[0]}" >> "$GITHUB_ENV"
      - name: Test Core, Extensions and Operator in kind
        env:
          E2E_IMAGE: ${{ inputs.image }}
        run: make e2e
      - name: Retain lifecycle diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-e2e-diagnostics
          path: .cache/e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
