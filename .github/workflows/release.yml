name: AgentRally Operator release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  security:
    uses: ./.github/workflows/security.yml
  packages:
    if: github.event.deleted != true
    uses: ./.github/workflows/packages.yml
  e2e:
    needs: [checks, security, packages]
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.packages.outputs.image }}
      image_artifact: agentrally-operator-image
      chart_artifact: agentrally-operator-chart
  publish:
    needs: [packages]
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ${{ needs.packages.outputs.image }}
      version: ${{ needs.packages.outputs.version }}
      chart_repository: ${{ needs.packages.outputs.chart_repository }}
