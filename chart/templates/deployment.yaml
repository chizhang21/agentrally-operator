apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentrally-operator
    app.kubernetes.io/component: manager
    {{- include "agentrally-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrally-operator
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrally-operator
        app.kubernetes.io/component: manager
        {{- include "agentrally-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "agentrally-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            {{- if .Values.connector.enabled }}
            - --connector-enabled=true
            {{- if .Values.connector.invocationPreview }}
            - --connector-invocation-preview=true
            {{- end }}
            - {{ printf "--connector-endpoint=%s" .Values.connector.endpoint | quote }}
            - {{ printf "--connector-id=%s" .Values.connector.id | quote }}
            {{- with .Values.connector.caFile }}
            - {{ printf "--connector-ca-file=%s" . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          env:
            - name: OPERATOR_RELEASE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/instance']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.connector.enabled }}
          volumeMounts:
            - name: connector-credentials
              mountPath: /var/run/agentrally-connector
              readOnly: true
          {{- end }}
      {{- if .Values.connector.enabled }}
      volumes:
        - name: connector-credentials
          secret:
            secretName: {{ .Values.connector.credentialsSecret | quote }}
      {{- end }}
