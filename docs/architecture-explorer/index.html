function drawGraph(graph,hot=[]){const nodes=new Map(graph.nodes.map(n=>[n.id,n]));const zoneHTML=(graph.zones||[]).map(z=>`<rect class="graph-zone" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}"/><text class="zone-label" x="${z.x+14}" y="${z.y+19}">${z.label}</text>`).join('');const edges=graph.edges.map(([from,to,label,dashed])=>{const a=nodes.get(from),b=nodes.get(to);if(!a||!b)return '';let x1,y1,x2,y2,path;const ac=a.x+a.w/2,bc=b.x+b.w/2; if(Math.abs(ac-bc)<110){x1=ac;x2=bc;const down=b.y>a.y;y1=down?a.y+a.h:a.y;y2=down?b.y:b.y+b.h;const d=(y2-y1)/2;path=`M${x1},${y1} C${x1},${y1+d} ${x2},${y2-d} ${x2},${y2}`}else{const right=b.x>a.x;x1=right?a.x+a.w:a.x;y1=a.y+a.h/2;x2=right?b.x:b.x+b.w;y2=b.y+b.h/2;const d=(x2-x1)*.5;path=`M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}`} const active=hot.includes(from)&&hot.includes(to);return `<path class="edge ${dashed?'dashed':''} ${active?'hot':''}" d="${path}" marker-end="url(#arrow-${active?'hot':'normal'})"/>${label?`<text class="edge-label" x="${(x1+x2)/2}" y="${(y1+y2)/2-8}" text-anchor="middle">${escapeHTML(label)}</text>`:''}`});const nodeHTML=graph.nodes.map(n=>{const r=resources[n.id];const dim=state.view==='overview'&&state.layer!=='all'&&((state.layer==='operator'&&!['orange','blue'].includes(r.tone))||(state.layer==='upstream'&&r.tone!=='green')||(state.layer==='storage'&&r.tone!=='purple'));return `<g class="diagram-node tone-${r.tone} ${state.selected===n.id?'selected':''} ${hot.includes(n.id)?'hot':''} ${dim?'dimmed':''}" role="button" tabindex="0" data-node="${n.id}" aria-label="查看 ${r.name} 的职责"><title>${r.name} · ${r.desc}</title><rect class="node-bg" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7"/><rect class="node-stripe" x="${n.x}" y="${n.y+15}" width="2.5" height="${n.h-30}" rx="1"/><text class="node-kicker" x="${n.x+14}" y="${n.y+19}">${escapeHTML(r.kind.split(' · ')[0])}</text><text class="node-title" x="${n.x+14}" y="${n.y+40}">${escapeHTML(r.name)}</text><text class="node-caption" x="${n.x+14}" y="${n.y+58}">${escapeHTML(({group:'空间 · 策略 · 预算',definition:'部署配置与不可变版本',instance:'逻辑身份与期望模式',operator:'5 Controllers · 1 Manager',revision:'已发布配置 · 可显式准备容量',claim:'原生分配请求',extensions:'分配 Sandbox · 补充预热池',sandbox:'一个可替换的执行',core:'Pod 与执行私有卷生命周期',pod:'Agent 应用及其进程状态',capabilities:'运行时 · 存储 · 网络',workspace:'固定身份 · 独立数据归属',pvc:'工作区文件',runtime:'Kata / gVisor / 默认运行时',namespace:'专属空间与原生策略',pool:'匹配配置的可分配容量',api:'Spec / Status / UID / RV',gateway:'HTTPRoute 由既有控制器执行',service:'应用后端 · ClusterIP',connector:'出站管理与调用预览',backend:'身份 · 业务会话 · 调用授权'})[n.id]||'')}</text></g>`}).join('');return `<svg class="architecture-graph" viewBox="0 0 1080 550" xmlns="http://www.w3.org/2000/svg" aria-label="${escapeHTML(currentPage()[1])} 架构关系图"><defs><marker id="arrow-normal" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="var(--muted)" opacity=".7"/></marker><marker id="arrow-hot" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="var(--accent)"/></marker></defs>${zoneHTML}${edges.join('')}${nodeHTML}</svg>`}
function canvas(graph,{title='架构画布',controls='',hot=[],extra=''}={}){return `<section class="canvas-card"><div class="canvas-toolbar"><div class="canvas-title">${icon('overview',13)} <strong>${title}</strong></div>${controls}</div><div class="graph-viewport"><div class="graph-stage" style="width:${state.zoom*100}%">${drawGraph(graph,hot)}</div></div>${extra}<div class="canvas-footer"><div class="legend"><span><i></i>声明</span><span><i class="upstream"></i>上游</span><span><i class="storage"></i>数据</span><span><i class="ref"></i>引用 / 观察</span></div><div class="zoom"><button data-action="zoom-out" aria-label="缩小">−</button><span>${Math.round(state.zoom*100)}%</span><button data-action="zoom-in" aria-label="放大">+</button><button data-action="zoom-reset" aria-label="重置缩放" title="重置">↺</button></div></div></section>`}

inition、Namespace 和原 Revision 受到记录保护；强制删除 Namespace 不在保护承诺内。':'PVC 删除策略与 PV、存储后端的数据回收是不同层面的行为。'}</div></div></div>`}

function renderAccess(){

 return `<div class="workspace"><div>${canvas(accessGraph(),{title:'控制与流量路径',controls,extra:`<div class="route-caption">${captions[state.access]}</div>`})}${insights(details)}</div>${inspector()}</div>`;

function renderBoundaries(){const rows=[['Group / Definition / Instance','可用','green','原生声明、固定版本、分配、生命周期及状态观察。'],['Kata / gVisor RuntimeClass','有条件可用','blue','传递已选 RuntimeClass。集群安装、调度与运行兼容性须满足。'],['冷分配 / 执行私有预热','可用','green','统一池与 Claim 路径；托管池预热副本默认0。'],['Definition 主动预热','有条件可用','blue','Group 授权、常驻应用与 readinessProbe；当前仅无 PVC 配置。Ready 与 Prepared 分开。'],['主动预热持久卷','未开放','gray','已有 Instance 发现的池可准备全新私有 PVC；Definition 主动 PVC 交接仍未实现。'],['外部 PVC 与文件保留','可用','green','按 UID 绑定，不接管数据；共享语义由原生卷和应用决定。'],['平台持久工作区','Preview','orange','新建 Group/Instance 显式开启；仅初始绑定、保留和删除保护。'],['Connector 受控 JSON / SSE','Preview','orange','默认关闭；真实后端协议和联合负载验证仍是上线门槛。'],['工作区删除后恢复','未开放','gray','同名新 UID 不能接管，必须先有有效释放证明及恢复授权。'],['retention 倒计时 / 自动 GC','未开放','gray','retentionSeconds 只记录策略。没有计时、自动删除或 purge。'],['活动感知自动挂起','未开放','gray','只执行显式 operatingMode；不消费 Activity Lease，也不从流量推断空闲。'],['旧写入者 fencing / 独占接管','未开放','gray','Pod 不存在或 API 对象被删都不是旧执行已停止写入的证明。']];return `<div class="boundaries" style="margin-top:0">${rows.map(([name,status,tone,desc])=>`<div class="boundary-row"><strong>${name}</strong><span>${badge(status,tone)}</span><span>${desc}</span></div>`).join('')}</div><div class="callout"><strong>这一层的边界是运行底座。</strong> Operator 负责 Kubernetes 资源、执行请求、数据绑定与可验证的状态。用户身份、IM 渠道、对话、模型代理、技能和业务定时任务属于上层应用或外部平台。</div>`}
function render(){const page=currentPage();$('breadcrumb').textContent=page[1];$('navigation').innerHTML=pages.map(([id,title],i)=>`<button class="nav-button ${id===state.view?'active':''}" data-view="${id}" aria-current="${id===state.view?'page':'false'}"><span class="nav-icon">${icon(id,17)}</span>${title}<span class="nav-index">0${i+1}</span></button>`).join('');const renderer={overview:renderOverview,crds:renderCRDs,flows:renderFlows,lifecycle:renderLifecycle,storage:renderStorage,capabilities:renderCapabilities,access:renderAccess,boundaries:renderBoundaries};$('content').innerHTML=header()+renderer[state.view]()+footer();document.title=`${page[1]} · AgentRally Operator`;updateThemeButton()}
function stopPlayback(){if(playback)clearInterval(playback);playback=null;state.playing=false}
function setView(view){if(!pages.some(p=>p[0]===view))return;stopPlayback();state.view=view;state.zoom=1;if(view==='crds'){state.selected='group';state.ownership='references'}else if(view==='access')state.selected=state.access==='http'?'gateway':'connector';else state.selected='operator';try{history.replaceState(null,'','#'+view)}catch{}render();$('content').scrollTop=0}
function setStep(step){state.step=Math.max(0,Math.min(flows[state.flow].steps.length-1,step));render()}
function toast(text){$('toast').textContent=text;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2200)}
function togglePlayback(){if(state.playing){stopPlayback();render();return}if(state.step>=flows[state.flow].steps.length-1)state.step=0;state.playing=true;render();playback=setInterval(()=>{if(state.step>=flows[state.flow].steps.length-1){stopPlayback();render()}else setStep(state.step+1)},2800)}
function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';$('theme-toggle').innerHTML=icon(dark?'sun':'moon',15);$('theme-toggle').setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式')}
function search(query=''){const q=query.toLowerCase().trim();const matches=Object.entries(resources).filter(([id,r])=>(r.name+' '+r.kind+' '+r.desc+' '+r.facts.join(' ')).toLowerCase().includes(q));$('search-results').innerHTML=matches.length?matches.map(([id,r])=>`<button class="search-result" data-search-node="${id}"><span>${icon(r.kind.includes('CRD')?'crds':'overview',16)}</span><span><strong>${r.name}</strong><small>${r.kind}</small></span>${badge(r.tag,r.tone)}</button>`).join(''):'<div class="search-empty">没有找到对应组件。试试 PVC、运行时或版本。</div>'}
function openSearch(){search();$('search-dialog').showModal();$('search-input').value='';$('search-input').focus()}
async function copyCode(kind){const value=kind==='storage'?storageModes[state.storage].code:`spec:\n  operatingMode: ${state.intent==='suspended'?'Suspended':'Running'}`;try{await navigator.clipboard.writeText(value);toast('配置片段已复制')}catch{const area=document.createElement('textarea');area.value=value;document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();toast(ok?'配置片段已复制':'请选中配置片段手动复制')}}
function exportHTML(){stopPlayback();render();const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='agentrally-architecture.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('已导出独立 HTML，可离线打开')}
document.addEventListener('click',event=>{const t=event.target.closest('button,[data-node]');if(!t)return;if(t.dataset.view){setView(t.dataset.view);return}if(t.dataset.searchNode){$('search-dialog').close();const id=t.dataset.searchNode;if(id==='pool'){state.flow='create';state.step=2;setView('flows')}else if(['api','gateway','service','connector','backend'].includes(id)){state.access=id==='api'?'native':['gateway','service'].includes(id)?'http':'connector';setView('access')}else setView(id==='namespace'?'crds':'overview');state.selected=id;render();return}if(t.dataset.node){state.selected=t.dataset.node;render();return}if(t.dataset.layer){state.layer=t.dataset.layer;render();return}if(t.dataset.ownership){state.ownership=t.dataset.ownership;render();return}if(t.dataset.flow){stopPlayback();state.flow=t.dataset.flow;state.step=0;render();return}if(t.dataset.step!==undefined){stopPlayback();setStep(Number(t.dataset.step));return}if(t.dataset.intent){state.intent=t.dataset.intent;render();return}if(t.dataset.storage){state.storage=t.dataset.storage;render();return}if(t.dataset.access){state.access=t.dataset.access;state.selected=t.dataset.access==='http'?'gateway':t.dataset.access==='native'?'api':'connector';render();return}if(t.dataset.copy){copyCode(t.dataset.copy);return}if(t.id==='search-open'){openSearch();return}if(t.id==='theme-toggle'){const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';try{localStorage.setItem('agentrally-architecture-theme',dark?'light':'dark')}catch{}updateThemeButton();return}if(t.id==='export-button'){exportHTML();return}if(t.dataset.action){switch(t.dataset.action){case 'next-step':stopPlayback();setStep(state.step+1);break;case 'prev-step':stopPlayback();setStep(state.step-1);break;case 'play':togglePlayback();break;case 'zoom-in':state.zoom=Math.min(1.8,Math.round((state.zoom+.15)*100)/100);render();break;case 'zoom-out':state.zoom=Math.max(.7,Math.round((state.zoom-.15)*100)/100);render();break;case 'zoom-reset':state.zoom=1;render();break}}});
document.addEventListener('change',event=>{if(event.target.id==='launch-select'){state.launch=event.target.value;render()}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();return}if(event.target.matches('input,select,textarea')||$('search-dialog').open)return;if(event.target.matches('[data-node]')&&(event.key==='Enter'||event.key===' ')){event.preventDefault();state.selected=event.target.dataset.node;render();return}if(state.view==='flows'&&['ArrowRight','ArrowLeft'].includes(event.key)){event.preventDefault();stopPlayback();setStep(state.step+(event.key==='ArrowRight'?1:-1))}});
$('search-input').addEventListener('input',event=>search(event.target.value));
$('search-dialog').addEventListener('click',event=>{if(event.target===$('search-dialog'))$('search-dialog').close()});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1);if(pages.some(p=>p[0]===view))setView(view)});
try{document.documentElement.dataset.theme=localStorage.getItem('agentrally-architecture-theme')==='dark'?'dark':'light'}catch{}
const initialView=location.hash.slice(1);if(pages.some(p=>p[0]===initialView))state.view=initialView;
if(state.view==='crds'){state.ownership='references';state.selected='group'}
render();
</script>
</body>
</html>
