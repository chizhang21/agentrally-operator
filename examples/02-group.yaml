# Basic Group with full optional policy references below.
apiVersion: arally.io/v1alpha1
kind: AgentGroup
metadata:
  name: demo
spec:
  namespace: agentrally-demo
  podSecurity: Restricted
  allocationPaused: false
  quota:
    hard:
      # Optional: enable after Kubernetes reports usage for this CRD count quota.
      # A missing native usage counter keeps the Group in QuotaPending.
      # count/agentinstances.arally.io: "20"
      requests.cpu: "16"
      requests.memory: 32Gi
  limitRange:
    limits:
      - type: Container
        default: {cpu: "2", memory: 4Gi}
        defaultRequest: {cpu: 100m, memory: 128Mi}
  prewarming:
    replicas: 0
    maxTotalReplicas: 4
    idleTTLSeconds: 300
  executionPolicy:
    requireImageDigest: false
    # allowedRuntimeClasses: [your-runtime-class]
  invocationAccess:
    mode: Disabled
    # Alternative: ConnectorOnly. Remove explicit ingress and Instance.interaction.
  # Optional: uncomment after adapting selectors and addresses for an enforcing CNI.
  # Include the model provider's destination when restricting egress.
  # networkPolicy:
  #   podSelector: {}
  #   policyTypes: [Ingress, Egress]
  #   ingress:
  #     - from:
  #         - podSelector: {}
  #     - from:
  #         - namespaceSelector:
  #             matchLabels: {kubernetes.io/metadata.name: gateway-system}
  #       ports:
  #         - {protocol: TCP, port: 8080}
  #   egress:
  #     # Adapt for your actual DNS deployment, including NodeLocal DNS.
  #     - to:
  #         - namespaceSelector:
  #             matchLabels: {kubernetes.io/metadata.name: kube-system}
  #           podSelector:
  #             matchLabels: {k8s-app: kube-dns}
  #       ports:
  #         - {protocol: UDP, port: 53}
  #         - {protocol: TCP, port: 53}
  #     - to:
  #         - namespaceSelector:
  #             matchLabels: {kubernetes.io/metadata.name: shared-services}
  #           podSelector:
  #             matchLabels: {app: your-service}
  #       ports:
  #         - {protocol: TCP, port: 8080}
  #     # Documentation addresses; replace before use.
  #     - to:
  #         - ipBlock:
  #             cidr: 198.51.100.0/24
  #             except: [198.51.100.128/25]
  #       ports:
  #         - {protocol: TCP, port: 443}
  # Optional HTTPRoute defaults; prepare the Gateway, DNS and TLS before enabling.
  # interactionDefaults:
  #   httpRoute:
  #     gatewayRef:
  #       name: shared
  #       namespace: gateway-system
  #       sectionName: https
  #     domain: agents.example.com
