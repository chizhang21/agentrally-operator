# Full reusable configuration. Apply 02-group.yaml first.
# Replace placeholders and prepare referenced dependencies before use.
apiVersion: arally.io/v1alpha1
kind: AgentDefinition
metadata:
  name: demo-agent
  namespace: agentrally-demo
spec:
  agentGroupRef:
    name: demo
  template: generic
  # Optional alternative: remove template and container, then use templateRef.
  # If using a native source, refer to sandbox-template.yaml and apply it first.
  # templateRef:
  #   name: custom-agent
  agentContainer: agent
  # Optional application contract for the separately enabled invocation preview.
  # invocationProtocol: HTTPJSONSSEV1
  container:
    image: registry.example.com/your-agent:replace-me
    imagePullPolicy: IfNotPresent
    command: [/bin/agent]
    args: [serve, --port, "8080"]
    runtimeClassName: your-runtime-class
    imagePullSecrets:
    - name: registry-credentials
    env:
    - name: LOG_LEVEL
      value: debug
    - name: CHANNEL_TOKEN
      valueFrom:
        secretKeyRef:
          name: agent-credentials
          key: channel-token
    envFrom:
    - configMapRef:
        name: agent-settings
    - secretRef:
        name: agent-credentials
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        cpu: "8"
        memory: 16Gi
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 2
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 30
      failureThreshold: 3
  security:
    profile: Restricted
    serviceAccountName: agent-runtime
    # Optional: choose a non-root UID; omit to use the image or admission default.
    # runAsUser: 1000
  # Zero disables proactive preparation. Raising it requires a Group prewarming cap.
  prewarming:
    replicas: 0
  # Optional private PVC default; unavailable for proactive preparation.
  # workspace:
  #   mountPath: /workspace
  #   readOnly: false
  #   volumeClaimTemplate:
  #     accessModes: [ReadWriteOnce]
  #     volumeMode: Filesystem
  #     storageClassName: your-storage-class
  #     resources:
  #       requests:
  #         storage: 20Gi
  modelProvider:
    baseURL: https://model.example.com/v1
    model: your-model
    apiKeySecretRef:
      name: model-credentials
      key: api-key
