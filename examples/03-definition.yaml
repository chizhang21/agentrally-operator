# Basic runnable configuration with full optional field references.
# Apply 02-group.yaml first; prepare dependencies before enabling optional settings.
apiVersion: arally.io/v1alpha1
kind: AgentDefinition
metadata:
  name: demo-agent
  namespace: agentrally-demo
spec:
  agentGroupRef:
    name: demo
  template: generic
  # Optional alternative: remove template and container, then use templateRef.
  # If using a native source, refer to sandbox-template.yaml and apply it first.
  # templateRef:
  #   name: custom-agent
  agentContainer: agent
  # Optional invocation preview contract; only declare it for an image implementing it.
  # invocationProtocol: HTTPJSONSSEV1
  container:
    image: ghcr.io/chizhang21/agentrally-demo-agent:v0.0.3
    imagePullPolicy: IfNotPresent
    # Optional entrypoint overrides for your own image.
    # command: [/bin/agent]
    # args: [serve, --port, "8080"]
    # Optional: select an installed RuntimeClass; omitted uses the node default.
    # runtimeClassName: your-runtime-class
    # Optional registry credentials in this namespace.
    # imagePullSecrets:
    # - name: registry-credentials
    env:
    - name: LOG_LEVEL
      value: info
    # Real model mode requires this API token in addition to modelProvider.
    # - name: API_TOKEN
    #   valueFrom:
    #     secretKeyRef:
    #       name: model-credentials
    #       key: api-token
    # envFrom:
    # - configMapRef:
    #     name: agent-settings
    # - secretRef:
    #     name: agent-credentials
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 2
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 30
      failureThreshold: 3
  security:
    # AnyUID allows root and runtime-default capabilities; requires a Baseline
    # AgentGroup and a dedicated ServiceAccount.
    profile: Restricted
    # Optional existing ServiceAccount; the built-in default has no API token mount.
    # serviceAccountName: agent-runtime
    # Optional: choose a non-root UID; omit to use the image or admission default.
    # runAsUser: 1000
  # Zero disables proactive preparation. Raising it requires a Group prewarming cap.
  prewarming:
    replicas: 0
  # Optional private PVC default; unavailable for proactive preparation.
  # workspace:
  #   mountPath: /workspace
  #   readOnly: false
  #   volumeClaimTemplate:
  #     accessModes: [ReadWriteOnce]
  #     volumeMode: Filesystem
  #     storageClassName: your-storage-class
  #     resources:
  #       requests:
  #         storage: 20Gi
  # Optional real model provider; prepare the Secret before enabling.
  # modelProvider:
  #   baseURL: https://model.example.com/v1
  #   model: your-model
  #   apiKeySecretRef:
  #     name: model-credentials
  #     key: api-key
