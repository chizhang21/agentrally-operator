# Full Instance field reference.
# Apply 02-group.yaml and 03-definition.yaml first.
# Replace placeholders and prepare the referenced dependencies before applying.
apiVersion: arally.io/v1alpha1
kind: AgentInstance
metadata:
  name: demo-agent-full
  namespace: agentrally-demo
spec:
  agentGroupRef:
    name: demo
  definitionRef:
    name: demo-agent
  # Running is the default. To create or keep this Instance paused:
  # operatingMode: Suspended
  # Optional: pin a published 64-character definition revision.
  # Omitted selects the latest on first acceptance.
  # Restarts retain the accepted revision; select revision explicitly to upgrade.
  # revision: <published-revision-hash>
  workspace:
    mountPath: /workspace
    readOnly: false
    volumeClaimTemplate:
      accessModes: [ReadWriteOnce]
      volumeMode: Filesystem
      resources:
        requests:
          storage: 20Gi
      # storageClassName: your-storage-class
    # Alternative: remove volumeClaimTemplate and reference an existing PVC.
    # existingClaimRef:
    #   name: your-pvc
    # exclusive: true
  interaction:
    type: HTTPRoute
    port: 8080
    hostname: demo-agent-full.agents.example.com
    scheme: HTTPS
    gatewayRef:
      name: shared
      namespace: gateway-system
      sectionName: https
  restartToken: initial
  lifecycle:
    shutdownPolicy: Retain
    retainFailed: true
    ttlSecondsAfterFinished: 3600
    # Wall-clock limit from allocation, including suspended time.
    maxLifetimeSeconds: 28800
    # Optional absolute deadline, including dependency/allocation time:
    # shutdownTime: "2099-01-01T00:00:00Z"
  provisioning:
    claimTimeoutSeconds: 300
    # Optional: select an existing external pool referencing the matching
    # Group-owned AgentRally configuration snapshot. AgentRally does not create this pool.
    # warmPoolRef:
    #   name: matching-pool
