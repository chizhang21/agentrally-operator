# Reusable configuration. Apply before its AgentInstance.
apiVersion: arally.io/v1alpha1
kind: AgentDefinition
metadata:
  name: legacy-agent
  namespace: arally-legacy
spec:
  agentGroupRef:
    name: legacy
  template: generic
  container:
    image: registry.example.com/legacy-agent:v1
  security:
    profile: AnyUID
    serviceAccountName: legacy-agent
    runAsUser: 0
