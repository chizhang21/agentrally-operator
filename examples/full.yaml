# Complete instance. Apply full-definition.yaml first. Replace placeholders and prepare every referenced dependency before applying.
apiVersion: arally.io/v1alpha1
kind: AgentInstance
metadata:
  name: builtin-agent
  namespace: arally-demo
spec:
  agentGroupRef:
    name: demo
  definitionRef:
    name: builtin-agent
  operatingMode: Running
  workspace:
    mountPath: /workspace
    readOnly: false
    volumeClaimTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
      # storageClassName: your-storage-class
  interaction:
    type: HTTPRoute
    port: 8080
    hostname: coding.example.com
    scheme: HTTPS
    gatewayRef:
      name: shared
      namespace: gateway-system
      sectionName: https
  restartToken: initial
  lifecycle:
    shutdownPolicy: Retain
    retainFailed: true
    ttlSecondsAfterFinished: 3600
    # Optional absolute deadline, including dependency/allocation time:
    # shutdownTime: "2099-01-01T00:00:00Z"
  provisioning:
    claimTimeoutSeconds: 300
    # Optional: select an existing external pool referencing the matching
    # Group-owned Arally configuration snapshot. Arally does not create this pool.
    # warmPoolRef:
    #   name: coding-pool
