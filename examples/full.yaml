# Instance field reference.
# Apply full-definition.yaml first.
# Replace placeholders and prepare the referenced dependencies before applying.
apiVersion: arally.io/v1alpha1
kind: AgentInstance
metadata:
  name: builtin-agent
  namespace: arally-demo
spec:
  agentGroupRef:
    name: demo
  definitionRef:
    name: builtin-agent
  # Optional: pin a published 64-character definition revision.
  # Omitted selects the latest on first acceptance and explicit restart.
  # revision: <published-revision-hash>
  operatingMode: Running
  workspace:
    mountPath: /workspace
    readOnly: false
    volumeClaimTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
      # storageClassName: your-storage-class
  interaction:
    type: HTTPRoute
    port: 8080
    hostname: coding.example.com
    scheme: HTTPS
    gatewayRef:
      name: shared
      namespace: gateway-system
      sectionName: https
  restartToken: initial
  lifecycle:
    shutdownPolicy: Retain
    retainFailed: true
    ttlSecondsAfterFinished: 3600
    # Optional wall-clock limit from allocation, including suspended time:
    # maxLifetimeSeconds: 28800
    # Optional idle suspension requires a caller-maintained activity Lease:
    # idleTimeoutSeconds: 900
    # activityLeaseRef:
    #   name: builtin-agent-activity
    # Optional absolute deadline, including dependency/allocation time:
    # shutdownTime: "2099-01-01T00:00:00Z"
  provisioning:
    claimTimeoutSeconds: 300
    # Optional: select an existing external pool referencing the matching
    # Group-owned Arally configuration snapshot. Arally does not create this pool.
    # warmPoolRef:
    #   name: coding-pool
