# Reusable configuration. Apply before its AgentInstance.
apiVersion: arally.io/v1alpha1
kind: AgentDefinition
metadata:
  name: agent
  namespace: agentrally-reference
spec:
  agentGroupRef:
    name: reference
  template: generic
  # Alternative: omit template/container and set templateRef.name to custom-agent.
  # See sandbox-template.yaml for the native source-template reference.
  agentContainer: agent
  # Optional application contract for the separately enabled invocation preview.
  # invocationProtocol: HTTPJSONSSEV1
  container:
    image: registry.example.com/your-agent:replace-me
    imagePullPolicy: IfNotPresent
    command: [/bin/agent]
    args: [serve, --port, "8080"]
    runtimeClassName: your-runtime-class
    imagePullSecrets:
    - name: registry-credentials
    env:
    - name: LOG_LEVEL
      value: debug
    - name: CHANNEL_TOKEN
      valueFrom:
        secretKeyRef:
          name: agent-credentials
          key: channel-token
    envFrom:
    - configMapRef:
        name: agent-settings
    - secretRef:
        name: agent-credentials
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        cpu: "8"
        memory: 16Gi
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 2
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 30
      failureThreshold: 3
  security:
    profile: Restricted
    serviceAccountName: agent-runtime
    # Optional: choose a non-root UID; omit to use the image or admission default.
    # runAsUser: 1000
  # Optional proactive preparation. Enable Group prewarming first.
  # prewarming:
  #   replicas: 1
  # Optional workspace default for Instances; requires cold allocation.
  # workspace:
  #   mountPath: /workspace
  #   volumeClaimTemplate:
  #     accessModes: [ReadWriteOnce]
  #     resources:
  #       requests:
  #         storage: 20Gi
  modelProvider:
    baseURL: https://model.example.com/v1
    model: your-model
    apiKeySecretRef:
      name: model-credentials
      key: api-key
