apiVersion: arally.io/v1alpha1
kind: AgentGroup
metadata:
  name: capacity
spec:
  # Pause new allocations without stopping existing agents or spares.
  allocationPaused: false
  # Each distinct resolved configuration receives its own spare capacity.
  # Applications start with their real credentials before allocation.
  prewarming:
    replicas: 1
    maxTotalReplicas: 4
    idleTTLSeconds: 300
  # Optional administrator constraints for all resolved execution containers.
  # executionPolicy:
  #   allowedRuntimeClasses: [kata-qemu]
  #   requireImageDigest: true
  limitRange:
    limits:
    - type: Container
      default:
        cpu: "1"
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
