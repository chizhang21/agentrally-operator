apiVersion: arally.io/v1alpha1
kind: AgentGroup
metadata:
  name: http-api-agent
spec:
  namespace: arally-http-api-agent
  interactionDefaults:
    httpRoute:
      gatewayRef:
        name: shared
        namespace: gateway-system
        sectionName: https
      domain: agents.example.com
  networkPolicy:
    podSelector: {}
    policyTypes: [Ingress]
    ingress:
    - from:
      - podSelector: {}
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway-system
      ports:
      - protocol: TCP
        port: 8000
