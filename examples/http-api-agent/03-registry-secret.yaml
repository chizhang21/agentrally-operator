# Optional for public images.
# If skipped, remove spec.container.imagePullSecrets from the AgentDefinition.
apiVersion: v1
kind: Secret
metadata:
  name: http-api-agent-registry
  namespace: agentrally-http-api-agent
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "REPLACE_WITH_REGISTRY_USERNAME",
          "password": "REPLACE_WITH_REGISTRY_PASSWORD"
        }
      }
    }
