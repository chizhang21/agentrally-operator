# Optional: skip for public images and remove runtime.imagePullSecrets from the Claim.
apiVersion: v1
kind: Secret
metadata:
  name: http-api-agent-registry
  namespace: arally-http-api-agent
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.com": {
          "username": "REPLACE_WITH_REGISTRY_USERNAME",
          "password": "REPLACE_WITH_REGISTRY_PASSWORD"
        }
      }
    }
