apiVersion: arally.io/v1alpha1
kind: AgentInstance
metadata:
  name: http-api-agent
  namespace: arally-http-api-agent
spec:
  agentGroupRef:
    name: http-api-agent
  definitionRef:
    name: http-api-agent
  operatingMode: Running
  interaction:
    type: HTTPRoute
