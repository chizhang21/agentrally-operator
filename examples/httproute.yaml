# Configure Group HTTPRoute defaults or provide one eligible Gateway with a wildcard domain.
apiVersion: arally.io/v1alpha1
kind: AgentClaim
metadata:
  name: demo-agent
  namespace: arally-demo
spec:
  agentGroupRef:
    name: demo
  template: generic
  runtime:
    image: registry.example.com/my-agent:v1
    ports:
    - name: http
      containerPort: 8080
  interaction:
    type: HTTPRoute
