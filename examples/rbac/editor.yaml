# Optional user-access role; apply and bind explicitly.
# The operator ServiceAccount does not use this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentrally-operator
  name: agentinstance-editor-role
rules:
- apiGroups:
  - arally.io
  resources:
  - agentdefinitions
  - agentinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - arally.io
  resources:
  - agentdefinitions/status
  - agentinstances/status
  verbs:
  - get
