# Apply the base Group and definition first.
# Keep the PVC and its Group when deleting the AgentInstance to retain the data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-workspace
  namespace: agentrally-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: arally.io/v1alpha1
kind: AgentInstance
metadata:
  name: retained-agent
  namespace: agentrally-demo
spec:
  agentGroupRef:
    name: demo
  definitionRef:
    name: demo-agent
  workspace:
    existingClaimRef:
      name: demo-workspace
    exclusive: true
    mountPath: /workspace
