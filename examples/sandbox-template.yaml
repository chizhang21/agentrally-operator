# Optional native source for 03-definition.yaml's templateRef.
# Apply 02-group.yaml first and prepare the shared-content PVC in this namespace.
# See docs/usage.md: Private workspaces and shared content.
# Adapt the image, process identity and storage permissions for your application.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: custom-agent
  namespace: agentrally-demo
  labels:
    arally.io/category: generic
spec:
  networkPolicyManagement: Unmanaged
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  service: true
  podTemplate:
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: ghcr.io/chizhang21/agentrally-demo-agent:v0.0.3@sha256:7026fcd4ae6b6a6b33d2200ca260feff62296fbab26c651436fda69879a66ca5
        imagePullPolicy: IfNotPresent
        env:
        # Application convention; the Operator does not load or interpret these files.
        - name: SHARED_CONTENT_PATH
          value: /shared/v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - name: shared-content
          mountPath: /shared
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      volumes:
      - name: shared-content
        persistentVolumeClaim:
          claimName: shared-content
          readOnly: true
