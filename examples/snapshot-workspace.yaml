# Create the demo Group first. Replace the image, StorageClass and snapshot name.
# The ready VolumeSnapshot must already exist in arally-demo, and its CSI driver
# must support restoration through the selected StorageClass.
apiVersion: arally.io/v1alpha1
kind: AgentInstance
metadata:
  name: restored-agent
  namespace: arally-demo
spec:
  agentGroupRef:
    name: demo
  definitionRef:
    name: restored-agent
  workspace:
    mountPath: /workspace
    volumeClaimTemplate:
      storageClassName: snapshot-capable
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
      dataSource:
        apiGroup: snapshot.storage.k8s.io
        kind: VolumeSnapshot
        name: workspace-seed
