# Trusted namespace, expected containers and effective configuration are checked
# in Go. Labels support official installations with customized workload names.
network:
  - provider: Calico
    daemonSets: [calico-node, canal, rke2-canal]
    containers: [calico-node]
    labels: {k8s-app: calico-node}
  - provider: Cilium
    daemonSets: [cilium]
    containers: [cilium-agent]
    labels: {k8s-app: cilium}
  - provider: OVN-Kubernetes
    daemonSets: [ovnkube-node]
    containers: [ovnkube-node, ovnkube-controller]
  - provider: Antrea
    daemonSets: [antrea-agent]
    containers: [antrea-agent]
  - provider: Weave Net
    daemonSets: [weave-net]
    containers: [weave-npc]
    missingContainerStatus: Unsupported
  - provider: Azure NPM
    daemonSets: [azure-npm]
    containers: [azure-npm]
    labels: {k8s-app: azure-npm}
  - provider: AWS VPC CNI
    daemonSets: [aws-node]
    containers: [aws-network-policy-agent, aws-eks-nodeagent]
    labels: {k8s-app: aws-node}
    missingContainerStatus: Unsupported
    booleanOption: enable-network-policy
  - provider: kube-router
    daemonSets: [kube-router]
    containers: [kube-router]
    booleanOption: run-firewall
    defaultBooleanValue: true
  # https://github.com/kubernetes-sigs/kube-network-policies/blob/master/install.yaml
  - provider: Kubernetes Network Policies
    daemonSets: [kube-network-policies]
    containers: [kube-network-policies]
    labels: {k8s-app: kube-network-policies}
  # https://github.com/flannel-io/flannel/blob/master/Documentation/netpol.md
  - provider: Flannel
    daemonSets: [kube-flannel-ds, kube-flannel]
    containers: [kube-network-policies]
    labels: {app: flannel}
    missingContainerStatus: Unsupported
  # kindnet policy support depends on the installed image/version. Do not infer
  # a global negative, or current enforcement, from the transport workload name.
  - provider: kindnet
    daemonSets: [kindnet]
    status: Unknown
  # Policy configuration lives on kube-ovn-controller, a separate Deployment.
  - provider: Kube-OVN
    daemonSets: [kube-ovn-cni]
    containers: [cni-server]
    status: Unknown
