# Built-in Pod environment; application settings come from AgentDefinition.container.
# Process identity and capabilities come from AgentDefinition.security.
metadata:
  labels:
    arally.io/category: generic
spec:
  nodeSelector:
    kubernetes.io/os: linux
  automountServiceAccountToken: false
  containers:
  - env:
    - name: LOG_LEVEL
      value: info
    imagePullPolicy: IfNotPresent
    name: agent
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
    volumeMounts:
    - mountPath: /tmp
      name: agentrally-tmp
  terminationGracePeriodSeconds: 30
  restartPolicy: Always
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - emptyDir: {}
    name: agentrally-tmp
